# Tests on every push; a signed desktop release when a version tag is pushed.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The `release` job builds the Windows installer, smoke-tests it on the clean
# runner, and publishes it with `latest.json` — the file installed apps poll
# (releases/latest/download/latest.json) to find out there is an update.
#
# Secret needed: TAURI_SIGNING_PRIVATE_KEY — the updater key generated with
# `tauri signer generate`. Its public half is in desktop/src-tauri/tauri.conf.json;
# an app only installs updates signed with it.

name: desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Versions in step
        run: python scripts/sync_version.py --check
      - name: Engine tests
        run: python -m pytest tests -q

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Typecheck
        run: npx tsc --noEmit -p .
        working-directory: web
      - name: Front-end tests
        run: npx vitest run
        working-directory: web

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches VERSION
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "v$(tr -d '[:space:]' < VERSION)" \
            || { echo "tag ${GITHUB_REF_NAME} != VERSION $(cat VERSION)"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-build.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: desktop

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Build the installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: ./desktop/build.ps1

      - name: Smoke test the installed app
        shell: pwsh
        run: ./desktop/smoke.ps1 -Install

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
