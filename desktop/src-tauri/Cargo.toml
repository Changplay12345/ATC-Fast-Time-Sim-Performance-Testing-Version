[package]
name = "atc-fts-desktop"
version = "0.2.2"
description = "ATC Fast-Time Simulation Tool — desktop shell"
authors = ["BearCat AEL Co"]
license = "SEE LICENSE IN EULA.md"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
getrandom = "0.2"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
